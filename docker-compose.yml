# Local development database: PostgreSQL + pgvector (SPEC 2.5). Not for production.
# Credentials come from .env (never committed); see .env.example.
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17   # pgvector 0.8.7 on PostgreSQL 17
    container_name: p7-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # reachable from this computer only
    volumes:
      - p7_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  p7_pgdata:
